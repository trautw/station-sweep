<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Station Sweep</title>
  </head>
  <body>
    <div id="app">
      <header id="top-strip" class="strip">
        <span>SCORE <span id="score">0</span></span>
        <span>HI <span id="highscore">0</span></span>
        <span>LEVEL <span id="level">1</span></span>
        <span>LIVES <span id="lives"></span></span>
      </header>
      <main id="deck-area">
        <canvas id="deck"></canvas>
      </main>
      <footer id="bottom-strip" class="strip">
        <span>EMP <span id="emp-charges"></span></span>
        <!-- Strip buttons (pause; ticket 13 adds mute next to it). -->
        <span id="strip-buttons"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
